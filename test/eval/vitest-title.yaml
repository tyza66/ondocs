# Questions about Vitest asked on Stack Overflow under the vitest tag, as their askers
# titled them, each with the pages of Vitest's docs that its accepted answer (or a
# maintainer's) links, at vitest-dev/vitest@2899eb3; and 15 off-topic questions from other tags.
# The questions are Stack Overflow's, CC BY-SA 4.0: README.md in this folder credits and links
# each one, and says how its pages were chosen. CI scores the file on every change.
#
#   node scripts/corpus.mjs .corpus vitest
#   ondocs index .corpus/vitest/docs --framework none --base-url / --ignore 'guide/examples/**' --ignore guide/cli-generated.md --ignore AGENTS.md -e none -o vitest.json
#   ondocs eval test/eval/vitest-title.yaml --index vitest.json

# Keyword-only, these docs score hit@1 5/26, hit@3 7/26, hit@5 7/26 and MRR 0.22,
# refuse 4 of the 26 answerable questions, and answer 3 of the 15 off-topic ones. The
# thresholds sit just under those scores: a change that loses a question fails CI, and has to
# say why.
thresholds:
  hit@1: 0.19
  hit@3: 0.26
  hit@5: 0.26
  mrr: 0.22
  refusalPrecision: 0.75
  refusalRecall: 0.8

