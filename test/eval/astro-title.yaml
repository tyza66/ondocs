# Questions about Astro asked on Stack Overflow under the astrojs tag, as their askers
# titled them, each with the pages of Astro's English docs that its accepted answer (or a
# maintainer's) links, at withastro/docs@3480e4b; and 15 off-topic questions from other tags.
# The questions are Stack Overflow's, CC BY-SA 4.0: README.md in this folder credits and links
# each one, and says how its pages were chosen. CI scores the file on every change.
#
#   node scripts/corpus.mjs .corpus astro
#   ondocs index .corpus/astro/src/content/docs/en --framework starlight --base-url /en -e none -o astro.json
#   ondocs eval test/eval/astro-title.yaml --index astro.json

# Keyword-only, these docs score hit@1 10/95, hit@3 21/95, hit@5 22/95 and MRR 0.16,
# refuse 8 of the 95 answerable questions, and answer 1 of the 15 off-topic ones. The
# thresholds sit just under those scores: a change that loses a question fails CI, and has to
# say why.
thresholds:
  hit@1: 0.1
  hit@3: 0.22
  hit@5: 0.23
  mrr: 0.15
  refusalPrecision: 0.63
  refusalRecall: 0.93

