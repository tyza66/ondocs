# Questions about Docusaurus asked on Stack Overflow under the docusaurus tag, as their askers
# titled them, each with the pages of docusaurus.io's docs that its accepted answer (or a
# maintainer's) links, at facebook/docusaurus@c245217; and 15 off-topic questions from other tags.
# The questions are Stack Overflow's, CC BY-SA 4.0: README.md in this folder credits and links
# each one, and says how its pages were chosen. CI scores the file on every change.
#
#   node scripts/corpus.mjs .corpus docusaurus
#   ondocs index .corpus/docusaurus/website/docs --framework docusaurus --base-url /docs -e none -o docusaurus.json
#   ondocs eval test/eval/docusaurus-title.yaml --index docusaurus.json

# Keyword-only, these docs score hit@1 5/33, hit@3 8/33, hit@5 10/33 and MRR 0.21,
# refuse 3 of the 33 answerable questions, and answer 2 of the 15 off-topic ones. The
# thresholds sit just under those scores: a change that loses a question fails CI, and has to
# say why.
thresholds:
  hit@1: 0.15
  hit@3: 0.24
  hit@5: 0.3
  mrr: 0.21
  refusalPrecision: 0.81
  refusalRecall: 0.86

questions:
