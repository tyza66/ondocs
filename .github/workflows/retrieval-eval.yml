name: Retrieval eval

# Retrieval on real docs with OpenAI's embeddings, which CI's keyword-only evals cannot measure
# without a key: scripts/retrieval-eval.mjs indexes docusaurus.io's, Astro's and Vitest's docs at
# the commits scripts/corpus.mjs pins with text-embedding-3-small at 512 dimensions, runs
# `ondocs eval` on test/eval/docusaurus.io.yaml and on the Stack Overflow questions of
# test/eval/<corpus>-title.yaml at minSimilarity 0.15 to 0.40, and writes the report to the run's
# summary and an artifact. On demand only, with the OPENAI_API_KEY repository secret: it never
# runs on a push or a pull request.
#
# Cost: before it embeds anything, the run counts each docs folder's chunks with a keyword-only
# build, and stops if one has more than MAX_CHUNKS. The pinned docs are 1,070, 4,805 and 2,233
# chunks of at most 1,200 characters: about 716,000, 2,766,000 and 1,467,000 characters with
# their page titles and headings, 4.95 million in all, and fewer tokens than characters. A failed
# batch is tried at most three times, and the 227 questions of the four files are embedded once
# per gate, six times.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Three docs sites, text-embedding-3-small at 512 dimensions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAX_CHUNKS: 5000
    steps:
      - name: Check that the OpenAI key is set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=No OPENAI_API_KEY secret::This workflow embeds with OpenAI. Add an OPENAI_API_KEY repository secret (Settings, Secrets and variables, Actions), then run it again."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Fetch docusaurus.io's, Astro's and Vitest's docs at the pinned commits
        run: node scripts/corpus.mjs
      # The key goes to this step only, not to the install or the build.
      - name: Index with text-embedding-3-small and score it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/retrieval-eval.mjs --out "$RUNNER_TEMP/retrieval-eval" --max-chunks "$MAX_CHUNKS"
      - name: Write the report to the run's summary
        run: cat "$RUNNER_TEMP/retrieval-eval/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report, the indexes and the questions as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrieval-eval
          path: |
            ${{ runner.temp }}/retrieval-eval/report.json
            ${{ runner.temp }}/retrieval-eval/report.md
            ${{ runner.temp }}/retrieval-eval/*/ask-index.json
            ${{ runner.temp }}/retrieval-eval/*/questions-*.yaml
          if-no-files-found: error
          retention-days: 90
